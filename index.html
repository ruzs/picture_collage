<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖單拼接</title>

  <!-- Bootstrap 5.3.9 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --page-bg: #f4f6fb;
      --accent: #5865f2;
      --accent-soft: #eef0ff;
      --text-main: #202638;
      --text-muted: #778096;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .upload-card {
      width: min(100%, 560px);
      border: 0;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(31, 45, 85, .08);
    }

    .upload-zone {
      display: flex;
      min-height: 250px;
      aspect-ratio: 1 / 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 2px dashed #cbd1e2;
      border-radius: 16px;
      background: #fafbff;
      cursor: pointer;
      transition: .2s ease;
      text-align: center;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .upload-icon {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 18px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 30px;
    }

    .preview-wrap {
      display: none;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: #f0f2f7;
    }

    .preview-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hint {
      color: var(--text-muted);
      font-size: .875rem;
    }

    .btn-primary {
      --bs-btn-bg: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: #4652d8;
      --bs-btn-hover-border-color: #4652d8;
    }
  </style>
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 d-flex justify-content-center">
        <section class="card upload-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="badge rounded-pill text-bg-light px-3 py-2 mb-3">IMAGE UPLOADER</span>
              <h1 class="h3 fw-bold mb-2">正方形圖片上傳</h1>
              <p class="hint mb-0">選擇一張圖片，即可立即預覽</p>
            </div>

            <input
              type="file"
              id="imageInput"
              class="d-none"
              accept="image/jpeg,image/png,image/webp"
            >

            <label for="imageInput" id="uploadZone" class="upload-zone w-100">
              <div class="upload-icon" aria-hidden="true">＋</div>
              <div class="fw-semibold mb-2">點擊選擇或拖曳圖片至此</div>
              <div class="hint">支援 JPG、PNG、WEBP</div>
              <div class="hint mt-1">圖片尺寸必須為正方形（寬度 = 高度）</div>
            </label>

            <div id="previewWrap" class="preview-wrap mt-3">
              <img id="imagePreview" src="" alt="圖片預覽">
            </div>

            <div id="imageInfo" class="d-none mt-3 text-center hint"></div>
            <div id="message" class="mt-3" role="alert" aria-live="polite"></div>

            <div class="d-flex gap-2 mt-4">
              <button type="button" id="chooseButton" class="btn btn-primary flex-grow-1">
                選擇圖片
              </button>
              <button type="button" id="removeButton" class="btn btn-outline-secondary d-none">
                移除
              </button>
            </div>

            <p class="hint text-center mt-4 mb-0">
              此範例僅於瀏覽器本機預覽，不會將圖片上傳至伺服器。
            </p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- jQuery 4.1.0 -->
  <script src="https://code.jquery.com/jquery-4.1.0.min.js"></script>
  <!-- Bootstrap 5.3.9 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(function () {
      let currentObjectUrl = null;

      const $input = $('#imageInput');
      const $zone = $('#uploadZone');
      const $previewWrap = $('#previewWrap');
      const $preview = $('#imagePreview');
      const $message = $('#message');
      const $info = $('#imageInfo');
      const $remove = $('#removeButton');

      function showMessage(text, type = 'danger') {
        $message.html(
          $('<div>', {
            class: `alert alert-${type} py-2 mb-0`,
            role: 'alert',
            text: text
          })
        );
      }

      function clearMessage() {
        $message.empty();
      }

      function clearPreview() {
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = null;
        }

        $preview.attr('src', '');
        $previewWrap.hide();
        $info.addClass('d-none').text('');
        $remove.addClass('d-none');
      }

      function handleFile(file) {
        clearMessage();

        if (!file) return;

        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];

        if (!allowedTypes.includes(file.type)) {
          clearPreview();
          $input.val('');
          showMessage('檔案格式不支援，請選擇 JPG、PNG 或 WEBP 圖片。');
          return;
        }

        const objectUrl = URL.createObjectURL(file);
        const image = new Image();

        image.onload = function () {
          if (image.naturalWidth !== image.naturalHeight) {
            URL.revokeObjectURL(objectUrl);
            clearPreview();
            $input.val('');
            showMessage(
              `圖片必須是正方形，目前尺寸為 ${image.naturalWidth} × ${image.naturalHeight}。`
            );
            return;
          }

          if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
          }

          currentObjectUrl = objectUrl;
          $preview.attr('src', objectUrl);
          $previewWrap.show();
          $info
            .removeClass('d-none')
            .text(`${image.naturalWidth} × ${image.naturalHeight} px　｜　${formatFileSize(file.size)}`);
          $remove.removeClass('d-none');
        };

        image.onerror = function () {
          URL.revokeObjectURL(objectUrl);
          clearPreview();
          $input.val('');
          showMessage('圖片讀取失敗，請重新選擇圖片。');
        };

        image.src = objectUrl;
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      $input.on('change', function (event) {
        handleFile(event.target.files[0]);
      });

      $('#chooseButton').on('click', function () {
        $input.trigger('click');
      });

      $remove.on('click', function () {
        clearPreview();
        clearMessage();
        $input.val('');
      });

      // Drag and drop
      $zone.on('dragenter dragover', function (event) {
        event.preventDefault();
        event.stopPropagation();
        $zone.addClass('dragover');
      });

      $zone.on('dragleave', function (event) {
        event.preventDefault();
        event.stopPropagation();
        $zone.removeClass('dragover');
      });

      $zone.on('drop', function (event) {
        event.preventDefault();
        event.stopPropagation();
        $zone.removeClass('dragover');

        const files = event.originalEvent.dataTransfer.files;
        if (files && files.length) {
          handleFile(files[0]);
        }
      });

      // Prevent browser from opening a dropped file outside the upload area.
      $(document).on('dragover drop', function (event) {
        if (!$(event.target).closest('#uploadZone').length) {
          event.preventDefault();
        }
      });
    });
  </script>
</body>
</html>
