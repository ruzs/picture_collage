<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>圖單拼接</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link href="dist/bootstrap.min.css" rel="stylesheet"> <!-- v5.3.9 -->
    <style>
        :root {
            --page-bg: #f4f6fb;
            --accent: #5865f2;
            --accent-soft: #eef0ff;
            --text-main: #202638;
            --text-muted: #778096;
        }

        body {
            min-height: 100vh;
            background: var(--page-bg);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .app-card {
            border: 0;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(31, 45, 85, .08);
        }

        .upload-zone {
            display: flex;
            min-height: 230px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            border: 2px dashed #cbd1e2;
            border-radius: 16px;
            background: #fafbff;
            cursor: pointer;
            text-align: center;
            transition: .2s ease;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-icon {
            display: grid;
            width: 64px;
            height: 64px;
            place-items: center;
            margin-bottom: 14px;
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 32px;
        }

        .source-thumb {
            width: 76px;
            height: 76px;
            border-radius: 12px;
            object-fit: contain;
            border: 1px solid #e4e7ef;
            background:
                linear-gradient(45deg, #e9ebf2 25%, transparent 25%),
                linear-gradient(-45deg, #e9ebf2 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e9ebf2 75%),
                linear-gradient(-45deg, transparent 75%, #e9ebf2 75%);
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
        }

        .tile-card {
            border: 1px solid #e4e7ef;
            border-radius: 18px;
            background: #fff;
            padding: 16px;
            transition: box-shadow .15s ease;
        }

        .tile-card:hover {
            box-shadow: 0 6px 18px rgba(31, 45, 85, .06);
        }

        .tile-preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background:
                linear-gradient(45deg, #e9ebf2 25%, transparent 25%),
                linear-gradient(-45deg, #e9ebf2 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e9ebf2 75%),
                linear-gradient(-45deg, transparent 75%, #e9ebf2 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        .tile-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform .2s ease;
        }

        .tile-index-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(32, 38, 56, 0.85);
            color: #fff;
            font-size: .875rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            z-index: 2;
        }

        .hint {
            color: var(--text-muted);
            font-size: .9rem;
        }

        .btn-primary {
            --bs-btn-bg: var(--accent);
            --bs-btn-border-color: var(--accent);
            --bs-btn-hover-bg: #4652d8;
            --bs-btn-hover-border-color: #4652d8;
        }

        /* 確保 btn-lg 在卡片內四等分且文字絕不換行 */
        .angle-btn {
            flex: 1 1 0;
            padding-left: 0;
            padding-right: 0;
            white-space: nowrap;
            font-weight: 500;
        }

        .angle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .tile-action-btn {
            flex: 1 1 0;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            white-space: nowrap;
            font-weight: 500;
        }

        .result-canvas-wrap {
            display: none;
            overflow: auto;
            padding: 16px;
            border: 1px solid #e4e7ef;
            border-radius: 14px;
            background:
                linear-gradient(45deg, #eef0f6 25%, transparent 25%),
                linear-gradient(-45deg, #eef0f6 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eef0f6 75%),
                linear-gradient(-45deg, transparent 75%, #eef0f6 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        #resultCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            margin: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <section class="card app-card">
                    <div class="card-body p-4 p-md-5">
                        <header class="text-center mb-4">
                            <span class="badge rounded-pill text-bg-light px-3 py-2 mb-3">IMAGE EDITOR</span>
                            <h1 class="h3 fw-bold mb-2">正方形圖片複製、旋轉與自由拼接</h1>
                            <p class="hint mb-0">上傳一張正方形圖片，自由複製多個區塊並各自設定旋轉角度，進行水平與垂直自由拼接</p>
                        </header>

                        <!-- 單張圖片上傳區 -->
                        <input type="file" id="imageInput" class="d-none" accept="image/jpeg,image/png,image/webp">
                        <label for="imageInput" id="uploadZone" class="upload-zone w-100">
                            <div class="upload-icon" aria-hidden="true">＋</div>
                            <div class="fw-semibold fs-5 mb-2">點擊選擇或拖曳一張圖片至此</div>
                            <div class="hint">支援 JPG、PNG、WEBP</div>
                            <div class="hint mt-1">圖片必須為正方形（寬度 = 高度）</div>
                        </label>

                        <div id="message" class="mt-3" role="alert" aria-live="polite"></div>

                        <!-- 編輯器主區塊 -->
                        <div id="editor" class="d-none mt-4">
                            <!-- 原始圖片資訊列 -->
                            <div
                                class="d-flex align-items-center justify-content-between flex-wrap gap-3 p-3 p-md-4 rounded-4 bg-light border mb-4">
                                <div class="d-flex align-items-center gap-3">
                                    <img id="sourceThumb" class="source-thumb" alt="原始圖片縮圖">
                                    <div>
                                        <div class="fw-bold fs-5" id="sourceFileName">原始圖片</div>
                                        <div class="hint" id="imageInfo"></div>
                                    </div>
                                </div>
                                <div class="d-flex flex-wrap gap-2">
                                    <button type="button" id="chooseButton"
                                        class="btn btn-outline-primary btn-lg">更換圖片</button>
                                    <button type="button" id="removeButton"
                                        class="btn btn-outline-secondary btn-lg">清除全部</button>
                                </div>
                            </div>

                            <!-- 批次複製工具列 -->
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                                <div>
                                    <div class="section-title">複製區塊與獨立旋轉（目前共 <span id="totalCount">1</span> 張）</div>
                                    <div class="hint">每張複製圖片皆可獨立選擇旋轉角度、複製或調整排列順序</div>
                                </div>
                                <div class="d-flex align-items-center flex-wrap gap-2">
                                    <label for="addCopyCount" class="fw-semibold text-nowrap mb-0">新增數量：</label>
                                    <input type="number" id="addCopyCount" class="form-control form-control-lg text-center"
                                        style="width: 88px;" min="1" max="30" value="1">
                                    <button type="button" id="batchAddButton"
                                        class="btn btn-primary btn-lg text-nowrap">＋ 加入複製</button>
                                </div>
                            </div>

                            <!-- 複製區塊卡片網格：改為一列最多 3 張，完整容納 btn-lg -->
                            <div id="tileList" class="row g-3 g-md-4"></div>

                            <hr class="my-4 my-md-5">

                            <!-- 水平 + 垂直 網格拼接設定 -->
                            <div class="section-title mb-3">水平與垂直自由拼接設定</div>
                            <div class="row g-3 align-items-start">
                                <div class="col-12 col-md-4">
                                    <label for="columnsCount" class="form-label fw-semibold">水平每列張數（欄數）</label>
                                    <input type="number" class="form-control form-control-lg" id="columnsCount" min="1"
                                        max="50" value="2">
                                    <div class="form-text" id="gridSummaryText">自動計算垂直列數</div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="flowDirection" class="form-label fw-semibold">排列順序方向</label>
                                    <select id="flowDirection" class="form-select form-select-lg">
                                        <option value="row">水平優先（左→右）</option>
                                        <option value="col">垂直優先（上→下）</option>
                                    </select>
                                    <div class="form-text">可自由組合純水平、純垂直或多行網格</div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label class="form-label fw-semibold d-none d-md-block opacity-0"
                                        aria-hidden="true">執行</label>
                                    <div class="d-grid">
                                        <button type="button" id="stitchButton"
                                            class="btn btn-primary btn-lg fw-semibold">開始拼接圖片</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 拼接結果區 -->
                        <section id="resultSection" class="d-none mt-4">
                            <hr class="my-4 my-md-5">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                                <div>
                                    <div class="section-title">拼接結果</div>
                                    <div id="resultInfo" class="hint"></div>
                                </div>
                                <button type="button" id="downloadButton"
                                    class="btn btn-success btn-lg px-4 fw-semibold">下載拼接圖片</button>
                            </div>
                            <div class="result-canvas-wrap" id="resultCanvasWrap">
                                <canvas id="resultCanvas"></canvas>
                            </div>
                        </section>

                        <p class="hint text-center mt-4 mb-0">純前端處理，圖片不會傳送至伺服器。</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="dist/jquery-4.1.0.min.js"></script>
    <script src="dist/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            let sourceImage = null;
            let sourceObjectUrl = null;
            let tiles = []; // 儲存每個複製區塊的狀態: { id, angle }
            let nextTileId = 1;

            const $input = $('#imageInput');
            const $zone = $('#uploadZone');
            const $editor = $('#editor');
            const $tileList = $('#tileList');
            const $message = $('#message');
            const $resultSection = $('#resultSection');
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');

            function showMessage(message, type = 'danger') {
                $message.empty().append(
                    $('<div>', { class: `alert alert-${type} py-2 mb-0`, role: 'alert', text: message })
                );
            }

            function clearMessage() {
                $message.empty();
            }

            function clearResult() {
                $resultSection.addClass('d-none');
                $('#resultCanvasWrap').hide();
                canvas.width = 0;
                canvas.height = 0;
            }

            function resetEditor() {
                if (sourceObjectUrl) {
                    URL.revokeObjectURL(sourceObjectUrl);
                    sourceObjectUrl = null;
                }
                sourceImage = null;
                tiles = [];
                nextTileId = 1;
                $('#sourceThumb').attr('src', '');
                $tileList.empty();
                $editor.addClass('d-none');
                $zone.removeClass('d-none');
                clearResult();
            }

            function updateGridSummary() {
                const total = tiles.length;
                $('#totalCount').text(total);

                let cols = parseInt($('#columnsCount').val(), 10) || 1;
                if (cols < 1) cols = 1;
                const rows = Math.ceil(total / cols);
                $('#gridSummaryText').text(`將組成 ${cols} 欄（水平） × ${rows} 列（垂直）`);
            }

            // 渲染所有複製區塊卡片
            function renderTiles() {
                if (!sourceImage) return;
                $tileList.empty();

                tiles.forEach((tile, index) => {
                    // 一列最多 3 張卡片，確保所有 btn-lg 按鈕都不會被擠壓變形
                    const $col = $('<div>', { class: 'col-12 col-md-6 col-lg-4' });
                    const $card = $('<div>', { class: 'tile-card h-100 d-flex flex-column' });

                    // 預覽框
                    const $previewBox = $('<div>', { class: 'tile-preview-box mb-3' });
                    $previewBox.append(
                        $('<span>', { class: 'tile-index-badge', text: `#${index + 1}` }),
                        $('<img>', {
                            src: sourceObjectUrl,
                            alt: `區塊 ${index + 1}`,
                            css: { transform: `rotate(${tile.angle}deg)` }
                        })
                    );

                    // 角度選擇按鈕群組：套用 Bootstrap 最大尺寸 btn-group-lg
                    const $angleGroup = $('<div>', {
                        class: 'btn-group btn-group-lg w-100 mb-3',
                        role: 'group',
                        'aria-label': '選擇旋轉角度'
                    });

                    [0, 90, 180, 270].forEach(deg => {
                        const $btn = $('<button>', {
                            type: 'button',
                            class: `btn btn-outline-secondary angle-btn ${tile.angle === deg ? 'active' : ''}`,
                            text: `${deg}°`
                        }).on('click', function () {
                            tile.angle = deg;
                            renderTiles();
                            clearResult();
                        });
                        $angleGroup.append($btn);
                    });

                    // 操作按鈕區：兩層 2x2 結構 + Bootstrap 最大尺寸 btn-lg
                    const $actionContainer = $('<div>', { class: 'd-grid gap-2 mt-auto' });

                    // 第一排：前移 / 後移
                    const $moveRow = $('<div>', { class: 'd-flex gap-2' });
                    const $movePrev = $('<button>', {
                        type: 'button',
                        class: 'btn btn-light btn-lg border tile-action-btn',
                        title: '往前移',
                        text: '← 前移',
                        disabled: index === 0
                    }).on('click', function () {
                        if (index > 0) {
                            [tiles[index - 1], tiles[index]] = [tiles[index], tiles[index - 1]];
                            renderTiles();
                            clearResult();
                        }
                    });

                    const $moveNext = $('<button>', {
                        type: 'button',
                        class: 'btn btn-light btn-lg border tile-action-btn',
                        title: '往後移',
                        text: '後移 →',
                        disabled: index === tiles.length - 1
                    }).on('click', function () {
                        if (index < tiles.length - 1) {
                            [tiles[index + 1], tiles[index]] = [tiles[index], tiles[index + 1]];
                            renderTiles();
                            clearResult();
                        }
                    });
                    $moveRow.append($movePrev, $moveNext);

                    // 第二排：複製 / 刪除
                    const $manageRow = $('<div>', { class: 'd-flex gap-2' });
                    const $duplicateBtn = $('<button>', {
                        type: 'button',
                        class: 'btn btn-outline-primary btn-lg tile-action-btn',
                        title: '複製此區塊（含目前角度）',
                        text: '＋ 複製'
                    }).on('click', function () {
                        tiles.splice(index + 1, 0, {
                            id: nextTileId++,
                            angle: tile.angle
                        });
                        renderTiles();
                        clearResult();
                    });

                    const $deleteBtn = $('<button>', {
                        type: 'button',
                        class: 'btn btn-outline-danger btn-lg tile-action-btn',
                        title: '刪除此區塊',
                        text: '刪除',
                        disabled: tiles.length <= 1
                    }).on('click', function () {
                        if (tiles.length <= 1) return;
                        tiles.splice(index, 1);
                        renderTiles();
                        clearResult();
                    });
                    $manageRow.append($duplicateBtn, $deleteBtn);

                    $actionContainer.append($moveRow, $manageRow);
                    $card.append($previewBox, $angleGroup, $actionContainer);
                    $col.append($card);
                    $tileList.append($col);
                });

                updateGridSummary();
            }

            // 處理單張圖片上傳
            function handleFile(file) {
                clearMessage();
                if (!file) return;

                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    showMessage('檔案格式不支援，請選擇 JPG、PNG 或 WEBP 圖片。');
                    $input.val('');
                    return;
                }

                const objectUrl = URL.createObjectURL(file);
                const image = new Image();

                image.onload = function () {
                    if (image.naturalWidth !== image.naturalHeight) {
                        URL.revokeObjectURL(objectUrl);
                        showMessage(`圖片必須是正方形，目前尺寸為 ${image.naturalWidth} × ${image.naturalHeight}。`);
                        $input.val('');
                        return;
                    }

                    if (sourceObjectUrl) URL.revokeObjectURL(sourceObjectUrl);
                    sourceObjectUrl = objectUrl;
                    sourceImage = image;

                    if (tiles.length === 0) {
                        tiles = [
                            { id: nextTileId++, angle: 0 },
                            { id: nextTileId++, angle: 0 }
                        ];
                        $('#columnsCount').val(2);
                    }

                    $('#sourceThumb').attr('src', objectUrl);
                    $('#sourceFileName').text(file.name);
                    $('#imageInfo').text(`原始尺寸：${image.naturalWidth} × ${image.naturalHeight} px`);

                    $zone.addClass('d-none');
                    $editor.removeClass('d-none');
                    renderTiles();
                    clearResult();
                };

                image.onerror = function () {
                    URL.revokeObjectURL(objectUrl);
                    showMessage('圖片讀取失敗，請重新選擇圖片。');
                    $input.val('');
                };
                image.src = objectUrl;
            }

            function drawRotatedImage(targetContext, image, x, y, size, angle) {
                targetContext.save();
                targetContext.translate(x + size / 2, y + size / 2);
                targetContext.rotate(angle * Math.PI / 180);
                targetContext.drawImage(image, -size / 2, -size / 2, size, size);
                targetContext.restore();
            }

            // 事件綁定
            $input.on('change', function (event) {
                handleFile(event.target.files[0]);
            });

            $('#chooseButton').on('click', function () {
                $input.trigger('click');
            });

            $('#removeButton').on('click', function () {
                resetEditor();
                clearMessage();
                $input.val('');
            });

            $('#batchAddButton').on('click', function () {
                if (!sourceImage) return;
                const addCount = parseInt($('#addCopyCount').val(), 10);
                if (!Number.isInteger(addCount) || addCount < 1 || addCount > 30) {
                    showMessage('新增複製數量請輸入 1 到 30 的整數。');
                    return;
                }
                if (tiles.length + addCount > 100) {
                    showMessage('總區塊數量最多為 100 張。');
                    return;
                }

                clearMessage();
                for (let i = 0; i < addCount; i++) {
                    tiles.push({ id: nextTileId++, angle: 0 });
                }
                renderTiles();
                clearResult();
            });

            $('#columnsCount').on('input change', function () {
                updateGridSummary();
                clearResult();
            });

            $('#flowDirection').on('change', function () {
                clearResult();
            });

            $('#stitchButton').on('click', function () {
                if (!sourceImage || tiles.length === 0) {
                    showMessage('請先上傳圖片。');
                    return;
                }

                const cols = parseInt($('#columnsCount').val(), 10);
                if (!Number.isInteger(cols) || cols < 1 || cols > 50) {
                    showMessage('水平每列張數請輸入 1 到 50 的整數。');
                    return;
                }

                const total = tiles.length;
                const rows = Math.ceil(total / cols);
                const flow = $('#flowDirection').val();
                const size = sourceImage.naturalWidth;

                canvas.width = cols * size;
                canvas.height = rows * size;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                tiles.forEach((tile, index) => {
                    let colIndex, rowIndex;

                    if (flow === 'row') {
                        colIndex = index % cols;
                        rowIndex = Math.floor(index / cols);
                    } else {
                        rowIndex = index % rows;
                        colIndex = Math.floor(index / rows);
                    }

                    const x = colIndex * size;
                    const y = rowIndex * size;
                    drawRotatedImage(ctx, sourceImage, x, y, size, tile.angle);
                });

                $resultSection.removeClass('d-none');
                $('#resultCanvasWrap').show();
                $('#resultInfo').text(
                    `共 ${total} 張｜網格 ${cols} 欄（水平） × ${rows} 列（垂直）｜輸出尺寸 ${canvas.width} × ${canvas.height} px`
                );
                clearMessage();
            });

            // $('#downloadButton').on('click', function () {
            //     if (!canvas.width || !canvas.height) return;
            //     const link = document.createElement('a');
            //     link.download = 'stitched-image.png';
            //     link.href = canvas.toDataURL('image/png');
            //     link.click();
            // });

            function isIOSDevice() {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            }

            function triggerBlobDownload(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'stitched-image.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () {
                    URL.revokeObjectURL(url);
                }, 1000);
            }

            $('#downloadButton').on('click', function () {
                if (!canvas.width || !canvas.height) return;

                canvas.toBlob(function (blob) {
                    if (!blob) {
                        showMessage('圖片產生失敗，可能是尺寸過大，請減少複製張數後再試一次。');
                        return;
                    }

                    const file = new File([blob], 'stitched-image.png', { type: 'image/png' });

                    // 僅在 iPhone / iPad 嘗試系統分享（可直接存進照片或檔案）；電腦直接走穩定下載
                    if (isIOSDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: '拼接圖片'
                        }).catch(function (err) {
                            if (err && err.name !== 'AbortError') {
                                triggerBlobDownload(blob);
                            }
                        });
                        return;
                    }

                    triggerBlobDownload(blob);
                }, 'image/png');
            });

            // 拖曳上傳（僅取第一張）
            $zone.on('dragenter dragover', function (event) {
                event.preventDefault();
                event.stopPropagation();
                $zone.addClass('dragover');
            });
            $zone.on('dragleave', function (event) {
                event.preventDefault();
                event.stopPropagation();
                $zone.removeClass('dragover');
            });
            $zone.on('drop', function (event) {
                event.preventDefault();
                event.stopPropagation();
                $zone.removeClass('dragover');
                const files = event.originalEvent.dataTransfer.files;
                if (files && files.length) handleFile(files[0]);
            });
            $(document).on('dragover drop', function (event) {
                if (!$(event.target).closest('#uploadZone').length) event.preventDefault();
            });
        });
    </script>
</body>

</html>
